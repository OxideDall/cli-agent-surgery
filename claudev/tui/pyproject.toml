[project]
name = "claudev-tui"
version = "1.0.0"
description = "Обзор, восстановление и запуск сессий Claude Code"
requires-python = ">=3.12"
dependencies = ["textual>=8.0"]

[project.scripts]
claudev-pick = "claudev_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudev_tui"]
